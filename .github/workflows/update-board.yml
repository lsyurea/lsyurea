name: Update open source board

# Runs the same scanner as lsyurea/Open-Source and refreshes the card in README.md.
on:
  schedule:
    - cron: "47 2 * * *" # daily, 30 minutes after the Open-Source board
  workflow_dispatch:

permissions:
  contents: write

jobs:
  board:
    uses: lsyurea/Open-Source/.github/workflows/update-board.yml@main
    with:
      layout: profile
